<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Para Ayumi</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#ffa1ef;color:#fff;overflow:hidden}.page{width:100vw;height:100vh;position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.8s}.hidden{opacity:0;pointer-events:none;transform:translateY(40px)}h1{font-size:3rem;opacity:0;animation:fade 2s forwards}p{margin-top:20px;font-size:1.4rem;text-align:center;width:80%;opacity:0;animation:fade 2s .8s forwards}button{position:absolute;bottom:40px;padding:15px 40px;border:none;border-radius:30px;background:#fff;color:#f568b5;font-size:18px;cursor:pointer}.cards{display:flex;gap:35px;flex-wrap:wrap}.card{width:180px;height:240px;perspective:1000px;cursor:pointer}.inner{width:100%;height:100%;position:relative;transition:.8s;transform-style:preserve-3d}.card.flip .inner{transform:rotateY(180deg)}.front,.back{position:absolute;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:#f568b5;border-radius:20px;backface-visibility:hidden;font-size:2rem}.front{font-size:60px}.back{transform:rotateY(180deg)}@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style></head><body>
<div class="page" id="page1"><h1>Para Ayumi</h1><p>A mulher mais linda, inteligente, forte e capaz do mundo</p><button onclick="nextPage()">Avançar →</button></div>
<div class="page hidden" id="page2"><div class="cards">
<div class="card" onclick="flip(this)"><div class="inner"><div class="front">❤️</div><div class="back">Eu</div></div></div>
<div class="card" onclick="flip(this)"><div class="inner"><div class="front">❤️</div><div class="back">Te</div></div></div>
<div class="card" onclick="flip(this)"><div class="inner"><div class="front">❤️</div><div class="back">Amo</div></div></div>
</div></div>
<script>
function nextPage(){document.getElementById('page1').classList.add('hidden');setTimeout(()=>document.getElementById('page2').classList.remove('hidden'),400)}
function flip(c){c.classList.toggle('flip')}
</script></body></html>
