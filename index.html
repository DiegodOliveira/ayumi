<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Para Ayumi</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
body{background:#ffa1ef;color:#fff;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;transition:.7s}
.hidden{opacity:0;pointer-events:none;transform:translateY(30px)}
h1{font-size:clamp(2rem,8vw,3rem);opacity:0;animation:f 1.5s forwards}
p{margin-top:18px;max-width:330px;text-align:center;font-size:clamp(1.1rem,4.5vw,1.5rem);line-height:1.5;opacity:0;animation:f 1.5s .5s forwards}
button{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));padding:14px 36px;border:none;border-radius:999px;background:#fff;color:#f568b5;font-size:18px}
.cards{display:flex;gap:14px;justify-content:center;align-items:center;width:100%}
.card{width:min(28vw,120px);height:min(42vw,170px);perspective:1000px;cursor:pointer}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.8s}.flip .inner{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;background:#f568b5;border-radius:18px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:0 10px 20px rgba(0,0,0,.2)}
.front{font-size:2.2rem}.back{transform:rotateY(180deg);font-size:1.6rem}.back{transform:rotateY(180deg)}
@keyframes f{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
</style></head><body>
<div class='page' id='p1'><h1>Para Ayumi</h1><p>A mulher mais linda, inteligente, forte e capaz do mundo</p><button onclick='n()'>Avançar →</button></div>
<div class='page hidden' id='p2'><div class='cards'>
<div class='card' onclick='this.classList.toggle("flip")'><div class='inner'><div class='front'>❤️</div><div class='back'>Eu</div></div></div>
<div class='card' onclick='this.classList.toggle("flip")'><div class='inner'><div class='front'>❤️</div><div class='back'>Te</div></div></div>
<div class='card' onclick='this.classList.toggle("flip")'><div class='inner'><div class='front'>❤️</div><div class='back'>Amo</div></div></div>
</div></div>
<script>function n(){p1.classList.add('hidden');setTimeout(()=>p2.classList.remove('hidden'),350)}</script>
</body></html>
